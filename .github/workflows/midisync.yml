name: Build

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [aarch64, x86_64, nextui]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zip

      - name: NextUI toolchain (gcc 8.3, glibc 2.28)
        if: matrix.arch == 'nextui'
        run: |
          mkdir -p "$RUNNER_TEMP/nextui-tc"
          curl -sSL https://github.com/LoveRetro/gcc-arm-8.3-aarch64-tg5040/releases/download/v8.3.0-20260204-190602-d37268f5/gcc-8.3.0-aarch64-nextui-linux-gnu-x86_64-host.tar.xz \
            | tar xJ -C "$RUNNER_TEMP/nextui-tc"
          echo "NEXTUI_TOOLCHAIN=$RUNNER_TEMP/nextui-tc/x86_64-aarch64-nextui-linux-gnu" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          ARCH: ${{ matrix.arch }}
        run: |
          cmake --version | head -n 1
          if ! scripts/build-aarch64.sh "$(git describe --tags --always)" > build.log 2>&1; then
            cat build.log
            grep -iE 'error|fatal' build.log | head -n 20 | sed 's/^/::error::/'
            tail -n 15 build.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -n 5 build.log

      - uses: actions/upload-artifact@v5
        with:
          name: mgba-midisync-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          tag_name: ${{ github.event.release.tag_name }}

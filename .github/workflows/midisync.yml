name: Build (aarch64)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zip

      - name: Build and package
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          cmake --version | head -n 1
          if ! scripts/build-aarch64.sh "$(git describe --tags --always)" > build.log 2>&1; then
            cat build.log
            grep -iE 'error|fatal' build.log | head -n 20 | sed 's/^/::error::/'
            tail -n 15 build.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -n 5 build.log

      - uses: actions/upload-artifact@v5
        with:
          name: mgba-midisync-aarch64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
